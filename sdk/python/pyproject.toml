[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satyadhvani"
version = "0.2.0"
description = "SatyaDhVani Voice Deepfake & Impersonation Prevention Framework SDK"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "respx>=0.21.0",
]
