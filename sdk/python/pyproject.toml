[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceintegrity"
version = "0.1.0"
description = "Voice Integrity & Impersonation Prevention Python SDK (voiceintegrity.v1)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "respx>=0.21.0",
]
